<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ular Tangga Cinta💕</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #fff;
            color: #4a1525;
        }

        /* Lobby / Menu Utama */
        .lobby-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            background: #fff;
            position: absolute;
            top: 0; left: 0;
            z-index: 2000;
        }

        .lobby-card {
            background: #fff;
            border: 2px solid #ff758f;
            border-radius: 20px;
            padding: 22px 20px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(255, 117, 143, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lobby-card h1 {
            color: #ff4d6d;
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 2px;
        }

        .lobby-card .subtitle {
            color: #d90429;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .lobby-btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            margin-bottom: 12px;
        }

        .btn-mulai {
            background: linear-gradient(135deg, #ff4d6d, #d90429);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 25px;
            font-size: 0.88rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(217, 4, 41, 0.3);
        }

        .btn-klimaks {
            background: linear-gradient(135deg, #7209b7, #3a0ca3);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 25px;
            font-size: 0.88rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(114, 9, 183, 0.3);
        }

        .btn-ldr {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 25px;
            font-size: 0.88rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 180, 216, 0.3);
        }

        .btn-mulai:active, .btn-klimaks:active, .btn-ldr:active, .btn-musik:active {
            transform: scale(0.97);
        }

        .btn-musik {
            background: #ffccd5;
            color: #d90429;
            border: none;
            padding: 10px;
            border-radius: 25px;
            font-size: 0.88rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(255, 204, 213, 0.5);
        }

        .lobby-note {
            color: #d90429;
            font-size: 0.65rem;
            font-weight: 600;
        }

        /* Layout Game Utama */
        .game-layout {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            padding: 6px 10px;
            background: #fff;
        }

        header {
            text-align: center;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        header h1 {
            color: #d90429;
            font-size: 1.05rem;
            margin: 0;
            font-weight: 800;
        }

        .round-badge {
            font-size: 0.7rem;
            background: #ffe5ec;
            color: #d90429;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
            display: inline-block;
            align-self: center;
        }

        .board-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex-grow: 1;
            padding: 2px 0;
            min-height: 0;
        }

        .board-wrapper {
            position: relative;
            aspect-ratio: 1 / 1;
            width: 100%;
            max-width: 100vw;
            background-color: #d90429;
            padding: 3px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(217, 4, 41, 0.25);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 1.5px;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
        }

        .board-svg {
            position: absolute;
            top: 3px;
            left: 3px;
            width: calc(100% - 6px);
            height: calc(100% - 6px);
            z-index: 1;
            pointer-events: none;
        }

        .cell {
            background-color: #fff;
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1px;
            font-size: clamp(0.35rem, 1.2vw, 0.48rem);
            font-weight: bold;
            position: relative;
            border: 1px solid #ffccd5;
            color: #d90429;
        }

        .cell.alt {
            background-color: #fff0f3;
        }

        .cell span {
            color: #800f2f;
        }

        .cell-icon {
            font-size: clamp(1.0rem, 3.9vw, 0.6rem);
            text-align: center;
            line-height: 1;
        }

        /* Panel Kontrol */
        .control-panel {
            width: 100%;
            max-width: 100%;
            background: #fff0f3;
            border: 1.5px solid #ffccd5;
            border-radius: 10px;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 12px rgba(217, 4, 41, 0.15);
            flex-shrink: 0;
            margin-bottom: 2px;
        }

        .player-badge {
            padding: 5px 8px;
            border-radius: 6px;
            background: #fff;
            border: 1px solid #ffccd5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            color: #800f2f;
            font-weight: bold;
            font-size: 0.6rem;
            min-width: 70px;
        }

        .player-badge.active {
            border-color: #d90429;
            box-shadow: 0 0 6px rgba(217, 4, 41, 0.4);
            background: #ffe5ec;
        }

        .dice-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .dice-btn {
            width: 54px;
            height: 54px;
            border: 2.5px solid #fff;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: background 0.3s ease;
        }

        .dice-btn.p1-turn {
            background: linear-gradient(135deg, #ff4d6d, #d90429);
        }

        .dice-btn.p2-turn {
            background: linear-gradient(135deg, #4ea8de, #3a86ff);
        }

        .dice-btn:active {
            transform: scale(0.95);
        }

        .dadu-status-text {
            font-size: 0.6rem;
            font-weight: bold;
            color: #800f2f;
        }

        .tokens-container {
            position: absolute;
            bottom: 2px;
            right: 2px;
            display: flex;
            gap: 3px;
            z-index: 10;
        }

        .token {
            width: clamp(16px, 4.2vw, 24px);
            height: clamp(16px, 4.2vw, 24px);
            border-radius: 50%;
            border: 2px solid white;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        .token-1 { background-color: #ef233c; } /* Pria */
        .token-2 { background-color: #3a86ff; } /* Wanita */

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(74, 21, 37, 0.75);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #fff0f3;
            border: 2px solid #d90429;
            padding: 14px 16px;
            border-radius: 14px;
            text-align: center;
            max-width: 310px;
            width: 90%;
            box-shadow: 0 8px 25px rgba(89, 13, 34, 0.4);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            color: #d90429;
            margin-top: 0;
            font-size: 0.95rem;
        }

        .modal-content p {
            font-size: 0.78rem;
            color: #590d22;
            line-height: 1.35;
            margin: 6px 0;
        }

        .modal-illustration {
            background: #ffe5ec;
            border: 1px dashed #ff758f;
            border-radius: 8px;
            padding: 8px;
            font-size: 0.72rem;
            color: #800f2f;
            margin: 6px 0;
            text-align: left;
        }

        .modal-illustration strong {
            color: #d90429;
            display: block;
            margin-bottom: 2px;
        }

        .timer-display {
            font-size: 1.2rem;
            font-weight: 900;
            color: #d90429;
            margin: 6px 0;
            background: #fff;
            border: 1.5px dashed #ff758f;
            border-radius: 8px;
            padding: 3px;
        }

        .btn-action-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .btn-start-timer {
            background: linear-gradient(135deg, #2b9348, #55a630);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 3px 10px rgba(43, 147, 72, 0.3);
        }

        .btn-action {
            background: linear-gradient(45deg, #ef233c, #d90429);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .btn-skip {
            background: linear-gradient(135deg, #d90429, #ef233c);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(217, 4, 41, 0.3);
        }

        .btn-lobby {
            background: #3a0ca3;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- LOBBY UTAMA -->
    <div class="lobby-container" id="lobby-screen">
        <div class="lobby-card">
            <h1>Ular Tangga Cinta 💕</h1>
            <div class="subtitle">Pilih Mode Permainan</div>
            
            <div class="lobby-btn-group">
                <button class="btn-mulai" onclick="startGame(1)">▶ Babak 1: Mode Klasik</button>
                <button class="btn-klimaks" onclick="startGame(2)">⚡ Babak 2: 33 Misi & 3 Level</button>
                <button class="btn-ldr" onclick="startGame(3)">📱 Babak 3:  LDR (Video Call)</button>
                <button class="btn-musik" id="lobby-music-btn" onclick="toggleAudio()">🎵 Play Musik Latar</button>
            </div>

            <div class="lobby-note">*Pastikan mode "Silent" dimatikan</div>
        </div>
    </div>

    <!-- LAYOUT UTAMA PERMAINAN -->
    <div class="game-layout" id="game-screen">
        <header>
            <h1>ULAR TANGGA CINTA 💕</h1>
            <div class="round-badge" id="round-indicator">Babak 1: Kejar Kemenangan</div>
        </header>

        <!-- Papan Game -->
        <div class="board-container">
            <div class="board-wrapper">
                <svg class="board-svg" id="board-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <!-- 10 Ular & 10 Tangga -->
                </svg>
                <div class="board" id="board"></div>
            </div>
        </div>

        <!-- Panel Kontrol -->
        <div class="control-panel">
            <div id="p1-card" class="player-badge active">
                <span>❤️ Pria</span>
                <span>Petak: <strong id="p1-pos">1</strong></span>
            </div>

            <div class="dice-area">
                <div class="dice-btn p1-turn" id="dice-btn" onclick="rollDice()">🎲</div>
                <div class="dadu-status-text" id="dice-result">Dadu: -</div>
            </div>

            <div id="p2-card" class="player-badge">
                <span>💙 Wanita</span>
                <span>Petak: <strong id="p2-pos">1</strong></span>
            </div>
        </div>
    </div>

    <!-- Modal Tantangan & Timer -->
    <div class="modal" id="challenge-modal">
        <div class="modal-content">
            <h3 id="modal-title">🔥 Sensasi Intim</h3>
            <p id="modal-text">Tantangan akan muncul di sini...</p>
            <div id="modal-illustration-container"></div>
            <div class="timer-display" id="timer-box">2:00</div>
            <div class="btn-action-group" id="modal-btn-container"></div>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 100;
        let positions = [1, 1];
        let currentPlayer = 0; // 0 = Pria, 1 = Wanita
        let isRolling = false;
        let currentRound = 1; 
        const playerNames = ["Pria (Merah)", "Wanita (Biru)"];
        let level3Collected = [0, 0]; 

        let audioCtx = null;
        let isAudioPlaying = false;
        let bgmInterval = null;
        let countdownInterval = null;
        let isGameOver = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleAudio() {
            initAudio();
            if (isAudioPlaying) {
                stopBGM();
                document.getElementById('lobby-music-btn').innerText = "🎵 Play Musik Latar";
                isAudioPlaying = false;
            } else {
                startBGM();
                document.getElementById('lobby-music-btn').innerText = "🎵 Matikan Musik";
                isAudioPlaying = true;
            }
        }

        function startBGM() {
            if (!audioCtx) return;
            const melody = [261.63, 329.63, 392.00, 523.25, 220.00, 261.63, 329.63, 440.00];
            let noteIdx = 0;

            if (bgmInterval) clearInterval(bgmInterval);

            bgmInterval = setInterval(() => {
                if (!isAudioPlaying) return;
                try {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(melody[noteIdx], audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.5);
                    noteIdx = (noteIdx + 1) % melody.length;
                } catch (e) {}
            }, 450);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        function playDiceSound() {
            initAudio();
            if (!audioCtx) return;
            for (let i = 0; i < 4; i++) {
                setTimeout(() => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(200 + Math.random() * 300, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                }, i * 60);
            }
        }

        function playStepSound() {
            initAudio();
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playAlarmSound() {
            initAudio();
            if (!audioCtx) return;
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                }, i * 250);
            }
        }

        function startGame(round) {
            initAudio();
            currentRound = round;
            positions = [1, 1];
            level3Collected = [0, 0];
            isGameOver = false;
            
            if (currentRound === 3) {
                document.getElementById('round-indicator').innerText = "Babak 3:  Video Call";
            } else if (currentRound === 2) {
                document.getElementById('round-indicator').innerText = "Babak 2: 33 Misi & 3 Level";
            } else {
                document.getElementById('round-indicator').innerText = "Babak 1: Kejar Kemenangan";
            }

            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('dice-btn').setAttribute('onclick', 'rollDice()');
            createBoard();
        }

        function backToLobby() {
            closeModal();
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'flex';
        }

        function getCellCoords(num) {
            let row = Math.floor((num - 1) / 10);
            let col = (num - 1) % 10;
            if (row % 2 === 1) {
                col = 9 - col;
            }
            let actualRow = 9 - row;
            let x = (col * 10) + 5;
            let y = (actualRow * 10) + 5;
            return { x, y };
        }

        function drawBoardDecorations() {
            const svg = document.getElementById('board-svg');
            svg.innerHTML = '';

            for (let start in specialTiles) {
                let tile = specialTiles[start];
                let s = getCellCoords(parseInt(start));
                let e = getCellCoords(tile.target);

                if (tile.type === 'ladder') {
                    let angle = Math.atan2(e.y - s.y, e.x - s.x);
                    let perpX = Math.sin(angle) * 1.5;
                    let perpY = -Math.cos(angle) * 1.5;

                    let r1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    r1.setAttribute('x1', s.x + perpX); r1.setAttribute('y1', s.y + perpY);
                    r1.setAttribute('x2', e.x + perpX); r1.setAttribute('y2', e.y + perpY);
                    r1.setAttribute('stroke', '#800f2f'); r1.setAttribute('stroke-width', '1');
                    svg.appendChild(r1);

                    let r2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    r2.setAttribute('x1', s.x - perpX); r2.setAttribute('y1', s.y - perpY);
                    r2.setAttribute('x2', e.x - perpX); r2.setAttribute('y2', e.y - perpY);
                    r2.setAttribute('stroke', '#800f2f'); r2.setAttribute('stroke-width', '1');
                    svg.appendChild(r2);

                    let steps = 5;
                    for (let i = 1; i < steps; i++) {
                        let t = i / steps;
                        let cx = s.x + (e.x - s.x) * t;
                        let cy = s.y + (e.y - s.y) * t;
                        let rung = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        rung.setAttribute('x1', cx + perpX); rung.setAttribute('y1', cy + perpY);
                        rung.setAttribute('x2', cx - perpX); rung.setAttribute('y2', cy - perpY);
                        rung.setAttribute('stroke', '#800f2f'); rung.setAttribute('stroke-width', '0.8');
                        svg.appendChild(rung);
                    }
                } else {
                    let midX = (s.x + e.x) / 2 + (e.y - s.y) * 0.25;
                    let midY = (s.y + e.y) / 2 - (e.x - s.x) * 0.25;

                    let path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', `M ${s.x} ${s.y} Q ${midX} ${midY} ${e.x} ${e.y}`);
                    path.setAttribute('stroke', '#2b9348');
                    path.setAttribute('stroke-width', '2.8');
                    path.setAttribute('fill', 'none');
                    path.setAttribute('stroke-linecap', 'round');
                    svg.appendChild(path);

                    let head = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    head.setAttribute('cx', s.x);
                    head.setAttribute('cy', s.y);
                    head.setAttribute('r', '2');
                    head.setAttribute('fill', '#132a13');
                    svg.appendChild(head);
                }
            }
        }

        function createBoard() {

                    let cellNum = (row % 2 === 1) ? (row * 10 + (10 - col)) : (row * 10 + (col + 1));

                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if ((row + col) % 2 === 1) {
                        cell.classList.add('alt');
                    }
                    cell.id = `cell-${cellNum}`;

                    let icon = '';
                    if (specialTiles[cellNum]) {
                        if (specialTiles[cellNum].type === 'ladder') {
                            cell.classList.add('ladder');
                            icon = currentRound === 3 ? '🔥🪜' : '🪜';

                            cell.classList.add('snake');

                        }
                    } else if (currentRound === 2 && round2Missions[cellNum]) {
                        icon = '✨'; 
                    } else if (cellNum === 100) {
                        icon = '👑';
                    }

                    cell.innerHTML = `
                        <span>${cellNum}</span>
                        <div class="cell-icon">${icon}</div>
                        <div class="tokens-container" id="tokens-${cellNum}"></div>

                    boardEl.appendChild(cell);

            drawBoardDecorations();
            updateTokens();

        function movePlayerAnimated(steps) {
            let p = currentPlayer;
            let current = positions[p];
            let tentativeTarget = current + steps;
            let target;

            if (tentativeTarget > BOARD_SIZE) {
                let overflow = tentativeTarget - BOARD_SIZE;
                target = BOARD_SIZE - overflow;
            } else {
                target = tentativeTarget;
            }

            let interval = setInterval(() => {
                if (positions[p] < target) {
                    positions[p]++;
                    playStepSound();
                    updateTokens();
                } else if (positions[p] > target) {
                    positions[p]--;
                    playStepSound();
                    updateTokens();
                } else {
                    clearInterval(interval);
                    let finalPos = positions[p];
                    
                    if (currentRound === 2 && finalPos >= 67 && finalPos <= 100) {
                        if (round2Missions[finalPos]) {
                            if (level3Collected[p] < 11) {

                positions = [1, 1];

                isGameOver = false;
                document.getElementById('round-indicator').innerText = "Babak 2: 33 Misi & 3 Level";
                createBoard();
            }

            isRolling = false;
        }
    </script>
