    <script>
        const BOARD_SIZE = 100;
        let positions = [1, 1];
        let currentPlayer = 0; 
        let isRolling = false;
        let currentRound = 3; 
        const playerNames = ["Pria (Merah)", "Wanita (Biru)"];
        let unsubFirestore = null;

        let audioCtx = null;
        let isAudioPlaying = false;
        let bgmInterval = null;
        let countdownInterval = null;
        let isGameOver = false;

        let isOnlineMode = false;
        let roomCode = "";
        let myRole = 0; 

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            const roleParam = urlParams.get('role');
            if (roomParam) {
                roomCode = roomParam;
                myRole = roleParam ? parseInt(roleParam) : 1;
                isOnlineMode = true;
                startGame(3);
                listenToRoom();
            }
        });

        function openRoomModal() { 
            document.getElementById('share-link-box').style.display = 'none';
            document.getElementById('room-modal').style.display = 'flex'; 
        }
        function closeRoomModal() { document.getElementById('room-modal').style.display = 'none'; }

        function generateRoomLink() {
            const codeInput = document.getElementById('input-room-code').value.trim();
            myRole = parseInt(document.getElementById('input-my-role').value);
            
            if (!codeInput) { alert("Masukkan nama ruangan!"); return; }

            roomCode = codeInput;
            isOnlineMode = true;

            const baseUrl = window.location.origin + window.location.pathname;
            const partnerRole = myRole === 0 ? 1 : 0;
            const shareLink = `${baseUrl}?room=${roomCode}&role=${partnerRole}`;

            document.getElementById('generated-link').innerText = shareLink;
            document.getElementById('share-link-box').style.display = 'block';

            // Ubah tombol bawah menjadi tombol masuk ruangan setelah link dibuat
            document.getElementById('room-btn-group').innerHTML = `
                <button class="btn-action" onclick="enterRoomDirectly()">Masuk ke Ruangan 🚀</button>
            `;

            // Daftarkan room ke Firestore
            const docRef = window.doc(window.db, "rooms", roomCode);
            window.getDoc(docRef).then((docSnap) => {
                if (!docSnap.exists()) {
                    window.setDoc(docRef, { positions: [1, 1], currentPlayer: 0, lastDice: '-' });
                }
            });
        }

        function copyShareLink() {
            const linkText = document.getElementById('generated-link').innerText;
            navigator.clipboard.writeText(linkText).then(() => {
                alert("Link berhasil disalin! Silakan kirimkan ke WhatsApp pasanganmu.");
            }).catch(err => {
                alert("Gagal menyalin link secara otomatis. Silakan salin manual.");
            });
        }

        function enterRoomDirectly() {
            closeRoomModal();
            // Kembalikan tombol modal ke semula untuk penggunaan berikutnya
            document.getElementById('room-btn-group').innerHTML = `
                <button class="btn-action" onclick="generateRoomLink()">Buat Link Ruangan</button>
                <button class="btn-lobby" onclick="closeRoomModal()">Batal</button>
            `;
            startGame(3);
            listenToRoom();
        }

        function listenToRoom() {
            const docRef = window.doc(window.db, "rooms", roomCode);
            if (unsubFirestore) unsubFirestore();
            unsubFirestore = window.onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    positions = data.positions || [1, 1];
                    currentPlayer = data.currentPlayer !== undefined ? data.currentPlayer : 0;
                    if (data.lastDice !== undefined) {
                        document.getElementById('dice-result').innerText = `Dadu: ${data.lastDice}`;
                    }
                    updateTokens();
                    updateTurnUI();
                }
            });
        }

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function toggleAudio() {
            initAudio();
            if (isAudioPlaying) {
                stopBGM(); document.getElementById('lobby-music-btn').innerText = "🎵 Play Musik Latar"; isAudioPlaying = false;
            } else {
                startBGM(); document.getElementById('lobby-music-btn').innerText = "🎵 Matikan Musik"; isAudioPlaying = true;
            }
        }

        function startBGM() {
            if (!audioCtx) return;
            const melody = [261.63, 329.63, 392.00, 523.25, 220.00, 261.63, 329.63, 440.00];
            let noteIdx = 0;
            if (bgmInterval) clearInterval(bgmInterval);
            bgmInterval = setInterval(() => {
                if (!isAudioPlaying) return;
                try {
                    let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(melody[noteIdx], audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
                    noteIdx = (noteIdx + 1) % melody.length;
                } catch (e) {}
            }, 450);
        }

        function stopBGM() { if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; } }
        function playDiceSound() { initAudio(); }
        function playStepSound() { initAudio(); }
        function playAlarmSound() { initAudio(); }

        function startGame(round) {
            initAudio();
            currentRound = round;
            if (round !== 3) {
                isOnlineMode = false;
                if (unsubFirestore) { unsubFirestore(); unsubFirestore = null; }
            }
            positions = [1, 1];
            isGameOver = false;
            
            document.getElementById('round-indicator').innerText = currentRound === 3 ? `Babak 3: Online LDR (Room: ${roomCode || 'Solo'})` : "Babak 1 / 2";
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            createBoard();
        }

        function backToLobby() {
            closeModal();
            isOnlineMode = false;
            if (unsubFirestore) { unsubFirestore(); unsubFirestore = null; }
            window.history.replaceState({}, document.title, window.location.pathname);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'flex';
        }

        const specialTiles = {
            3: { target: 22, type: 'ladder' }, 8: { target: 34, type: 'ladder' },
            15: { target: 44, type: 'ladder' }, 28: { target: 59, type: 'ladder' },

            63: { target: 81, type: 'ladder' }, 71: { target: 92, type: 'ladder' },
            78: { target: 96, type: 'ladder' }, 85: { target: 97, type: 'ladder' },
            18: { target: 4, type: 'snake' }, 32: { target: 12, type: 'snake' },

        };

        const ldrLadderRewards = {
            3: "📱🔥 <b>Bonus LDR Tangga (3):</b> Lepas pakaian atas di kamera, berikan 10 ciuman udara ke layar.",
            8: "📱🔥 <b>Bonus LDR Tangga (8):</b> Suruh pasangan membuka pakaian bawah dan pamerkan paha di kamera.",
            15: "📱🔥 <b>Bonus LDR Tangga (15):</b> Kamera sudut bawah (low angle) sambil mendesah sensual.",
            28: "📱🔥 <b>Bonus LDR Tangga (28):</b> Kirim video 10 detik saat kamu meraba dada/alat vital sendiri.",
            41: "📱🔥 <b>Bonus LDR Tangga (41):</b> Telanjangi tubuh atas sepenuhnya di depan kamera.",

            71: "📱🔥 <b>Bonus LDR Tangga (71):</b> Simulasi ciuman basah mendalam ke lensa kamera.",
            78: "📱🔥 <b>Bonus LDR Tangga (78):</b> Putar badan 360 derajat tanpa busana di depan kamera.",
            85: "📱🔥 <b>Bonus LDR Tangga (85):</b> Posisikan kamera menghadap area intim terbuka 45 detik."
        };

        const ldrSnakePunishments = {
            18: "📱🐍 <b>Hukuman Ular LDR (18):</b> Tunjukkan tubuh atas tanpa penutup 20 detik.",
            32: "📱🐍 <b>Hukuman Ular LDR (32):</b> Mainkan area intim sendiri di depan kamera.",

        function getCellCoords(num) {
            let row = Math.floor((num - 1) / 10);
            let col = (num - 1) % 10;
            if (row % 2 === 1) col = 9 - col;
            let actualRow = 9 - row;
            return { x: (col * 10) + 5, y: (actualRow * 10) + 5 };
        }

        function drawBoardDecorations() {
            const svg = document.getElementById('board-svg');
            svg.innerHTML = '';
            for (let start in specialTiles) {
                let tile = specialTiles[start];
                let s = getCellCoords(parseInt(start));
                let e = getCellCoords(tile.target);
                if (tile.type === 'ladder') {
                    let r = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    r.setAttribute('x1', s.x); r.setAttribute('y1', s.y); r.setAttribute('x2', e.x); r.setAttribute('y2', e.y);
                    r.setAttribute('stroke', '#800f2f'); r.setAttribute('stroke-width', '1'); svg.appendChild(r);
                } else {
                    let path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', `M ${s.x} ${s.y} Q ${(s.x+e.x)/2+5} ${(s.y+e.y)/2-5} ${e.x} ${e.y}`);
                    path.setAttribute('stroke', '#2b9348'); path.setAttribute('stroke-width', '2.5'); path.setAttribute('fill', 'none'); svg.appendChild(path);
                }
            }
        }

        function createBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for (let row = 9; row >= 0; row--) {
                for (let col = 0; col < 10; col++) {
                    let cellNum = (row % 2 === 1) ? (row * 10 + (10 - col)) : (row * 10 + (col + 1));
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if ((row + col) % 2 === 1) cell.classList.add('alt');
                    cell.id = `cell-${cellNum}`;

                    let icon = specialTiles[cellNum] ? (specialTiles[cellNum].type === 'ladder' ? '🪜' : '🐍') : (cellNum === 100 ? '👑' : '');
                    cell.innerHTML = `<span>${cellNum}</span><div class="cell-icon">${icon}</div><div class="tokens-container" id="tokens-${cellNum}"></div>`;
                    boardEl.appendChild(cell);
                }
            }
            drawBoardDecorations();
            updateTokens();
        }

        function updateTokens() {
            for (let i = 1; i <= BOARD_SIZE; i++) {
                let el = document.getElementById(`tokens-${i}`);
                if (el) el.innerHTML = '';
            }
            positions.forEach((pos, idx) => {
                const container = document.getElementById(`tokens-${pos}`);
                if (container) {
                    const token = document.createElement('div');
                    token.className = `token token-${idx + 1}`;
                    token.innerText = idx === 0 ? '♂' : '♀';
                    container.appendChild(token);
                }
            });
            document.getElementById('p1-pos').innerText = positions[0];
            document.getElementById('p2-pos').innerText = positions[1];
        }

        function updateTurnUI() {
            const diceBtn = document.getElementById('dice-btn');
            if (currentPlayer === 0) {
                document.getElementById('p1-card').classList.add('active');
                document.getElementById('p2-card').classList.remove('active');
                diceBtn.className = "dice-btn p1-turn";
            } else {
                document.getElementById('p2-card').classList.add('active');
                document.getElementById('p1-card').classList.remove('active');
                diceBtn.className = "dice-btn p2-turn";
            }
        }

        function rollDice() {
            if (isRolling || isGameOver) return;
            
            if (isOnlineMode && currentPlayer !== myRole) {
                alert(`Bukan giliranmu! Tunggu giliran ${playerNames[currentPlayer]}.`);
                return;
            }

            isRolling = true;
            document.getElementById('dice-result').innerText = `🎲...`;
            
            setTimeout(() => {
                let diceVal = Math.floor(Math.random() * 6) + 1;
                document.getElementById('dice-result').innerText = `Dadu: ${diceVal}`;
                
                let p = currentPlayer;
                let tentativeTarget = positions[p] + diceVal;
                let target = tentativeTarget > BOARD_SIZE ? BOARD_SIZE - (tentativeTarget - BOARD_SIZE) : tentativeTarget;

                positions[p] = target;
                let finalPos = positions[p];
                let nextPlayer = currentPlayer === 0 ? 1 : 0;
                let specialEvent = null;

                if (specialTiles[finalPos]) {
                    let tile = specialTiles[finalPos];
                    specialEvent = { type: tile.type, target: tile.target, pos: finalPos };
                    positions[p] = tile.target;
                }

                if (isOnlineMode) {
                    window.setDoc(window.doc(window.db, "rooms", roomCode), {
                        positions: positions,
                        currentPlayer: nextPlayer,
                        lastDice: diceVal
                    });
                }

                updateTokens();
                handleSpecialEvent(finalPos, specialEvent);
            }, 300);
        }

        function handleSpecialEvent(finalPos, specialEvent) {
            if (specialEvent) {
                setTimeout(() => {
                    let title = specialEvent.type === 'snake' ? `📱⚠️ Hukuman Ular LDR (${specialEvent.pos})!` : `📱🎁 Bonus Tangga LDR (${specialEvent.pos})!`;
                    let msg = specialEvent.type === 'snake' ? ldrSnakePunishments[specialEvent.pos] : ldrLadderRewards[specialEvent.pos] + `<br><br><i>Naik ke petak ${specialEvent.target}</i>`;
                    showModal(title, msg, 30);
                    updateTokens();
                    checkWin();
                }, 300);
            } else {
                checkWin();
            }
            isRolling = false;
        }

        function checkWin() {
            if (positions[currentPlayer] === BOARD_SIZE) {
                isGameOver = true;
                showModal("👑 Klimaks Sempurna LDR!", `Selamat! ${playerNames[currentPlayer]} menyelesaikan permainan dengan sempurna! 🔥`, 0, true);
                return;
            }
            isRolling = false;
        }

        function showModal(title, text, seconds = 120, isFinalWin = false) {
            document.getElementById('modal-title').innerHTML = title;
            document.getElementById('modal-text').innerHTML = text;
            document.getElementById('challenge-modal').style.display = 'flex';

            if (countdownInterval) clearInterval(countdownInterval);
            const timerBox = document.getElementById('timer-box');
            const btnGroup = document.getElementById('modal-btn-container');

            if (isFinalWin) {
                timerBox.style.display = 'none';
                btnGroup.innerHTML = `<button class="btn-lobby" onclick="backToLobby()">🏠 Kembali ke Lobi</button>`;
                return;
            }

            timerBox.style.display = 'block';
            timerBox.innerText = `${seconds}s`;
            btnGroup.innerHTML = `
                <button class="btn-start-timer" onclick="startTimerCountdown(${seconds})">▶ Mulai Tantangan</button>
                <button class="btn-skip" onclick="closeModal()">Skip ⏭</button>
            `;
        }

        function startTimerCountdown(seconds) {
            const timerBox = document.getElementById('timer-box');
            const btnGroup = document.getElementById('modal-btn-container');
            btnGroup.innerHTML = `<button class="btn-skip" onclick="closeModal()">Skip ⏭</button>`;

            let timeLeft = seconds;
            countdownInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    timerBox.innerText = `${timeLeft}s`;
                } else {
                    timerBox.innerText = "Waktu Selesai! 🎉";
                    clearInterval(countdownInterval);
                    btnGroup.innerHTML = `<button class="btn-action" onclick="closeModal()">Lanjutkan ✨</button>`;
                }
            }, 1000);
        }

        function closeModal() {
            if (countdownInterval) clearInterval(countdownInterval);
            document.getElementById('challenge-modal').style.display = 'none';
            isRolling = false;
        }
    </script>
</body>
</html>
